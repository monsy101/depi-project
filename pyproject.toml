[project]
name = "depi-project"
version = "1.0.0"
description = "Stable Diffusion fine-tuning and deployment API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.21.0",
    "diffusers>=0.14.0",
    "accelerate>=0.16.0",
    "peft>=0.4.0",
    "Pillow>=9.2.0",
    "opencv-python>=4.6.0",
    "mlflow>=2.8.0",
    "tensorboard>=2.13.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "streamlit>=1.28.0",
    "gradio>=3.0.0",
]

[tool.vercel]
entrypoint = "deployment.deployment.api.fastapi_app:app"
